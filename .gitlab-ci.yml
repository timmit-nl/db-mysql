PHP static:
  image: php:8.0
  stage: test
  before_script:
  - apt-get upgrade
  - apt-get update
  - apt-get -y install git
  - apt-get -y install zip
  - curl -sS https://getcomposer.org/installer | php
  - php composer.phar config -g cache-dir "$(pwd)/.composer-cache"
  - php composer.phar install --ignore-platform-reqs --optimize-autoloader --no-ansi --no-interaction --no-progress
  - touch ./CI
  script:
  - sh test/phpstan.sh | tee phpstan_results.txt
  - EXIT_CODE=$?
  - exit $EXIT_CODE
  cache:
    key: one-key-to-rule-them-all
    paths:
    - .composer-cache/
    - vendor/
  artifacts:
    when: always
    expire_in: 1 month
    paths:
    - phpstan_results.txt
  only:
    refs:
    - merge_requests
