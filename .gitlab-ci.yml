PHP codesniffer:
  image: pipelinecomponents/php-codesniffer:latest
  script:
    - phpcs -s -p --colors --extensions=php --standard=.phpcs.xml --exclude=Generic.Files.LineLength,Squiz.Classes.ValidClassName ./src
  allow_failure: true
  only:
    refs:
    - merge_requests