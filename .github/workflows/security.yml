name: Security

on:
  push:
    branches:
      - main
      - '*milestone*'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'  # weekly, Monday morning

permissions:
  contents: read

jobs:
  secret-detection:
    name: Secret detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest
          detect --source /repo --no-banner --redact

  dependency-audit:
    name: Dependency audit (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer audit
