HTML - htmllint:
  image: pipelinecomponents/eslint:latest
  stage: Linting
  script:
    - npm install -g htmllint-cli
    - htmllint $(find ./app/skin -type f -name "*.tpl" -name "*" ! -name "header.tpl" ! -name "dropdown.tpl")
  cache:
    key: "${CI_JOB_NAME}-cachekey"
    paths:
      - .composer-cache/
      - vendor/
      - node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'master'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - '**/*.tpl'
  allow_failure: false
SCSS - stylelint:
  image: pipelinecomponents/stylelint:0.18.0
  stage: Linting
  script:
    - stylelint app/skin/**/*.scss --syntax scss
  cache:
    key: "${CI_JOB_NAME}-cachekey"
    paths:
      - .composer-cache/
      - vendor/
      - node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == 'master'
